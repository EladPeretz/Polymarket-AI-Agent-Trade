[project]
name = "polymarket-perps-bot"
version = "0.0.1"
description = "LLM-agent trading bot for Polymarket stock perpetuals"
requires-python = ">=3.12"
dependencies = [
    # Perps SDK APIs are marked experimental; pin exactly and upgrade deliberately.
    "polymarket-client==0.13.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
